<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steven Atauchi - Pixel Art & SMW Romhacking</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/Z2QBUxO.gif">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Press Start 2P & Silkscreen -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <style>
        .font-pixel { font-family: 'Press Start 2P', cursive, monospace; }
        .font-retro { font-family: 'Silkscreen', cursive, monospace; }

        /* ===== Paletas ===== */
        :root {
            --bg-main: #0f0f1b;
            --bg-card: #181829;
            --border-outer: #383859;
            --border-inner: #5c5c8a;
            --text-main: #e2e2ff;
            --accent-main: #ff3b47;
            --accent-cyan: #55ffff;
            --accent-yellow: #ffcc00;
            --accent-green: #55ff55;
            --panel-header: #24243e;
            --scanline-opacity: 0.15;
        }

        .theme-gb {
            --bg-main: #0f380f;
            --bg-card: #1f521f;
            --border-outer: #306230;
            --border-inner: #8bac0f;
            --text-main: #9bbc0f;
            --accent-main: #8bac0f;
            --accent-cyan: #9bbc0f;
            --accent-yellow: #8bac0f;
            --accent-green: #9bbc0f;
            --panel-header: #306230;
        }

        .theme-cyber {
            --bg-main: #0d001a;
            --bg-card: #1a0033;
            --border-outer: #800080;
            --border-inner: #ff00ff;
            --text-main: #00ffff;
            --accent-main: #ff007f;
            --accent-cyan: #00ffff;
            --accent-yellow: #ffff00;
            --accent-green: #00ff66;
            --panel-header: #2b004f;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            image-rendering: pixelated;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .pixel-img { image-rendering: pixelated; }

        .pixel-box {
            background-color: var(--bg-card);
            border: 4px solid var(--border-outer);
            box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.5), inset 4px 4px 0px 0px rgba(255,255,255,0.1);
            position: relative;
        }

        .pixel-box-header {
            background-color: var(--panel-header);
            border-bottom: 4px solid var(--border-outer);
        }

        .pixel-btn {
            background-color: var(--border-outer);
            border: 2px solid var(--text-main);
            box-shadow: 0 4px 0 var(--border-inner);
            transition: all 0.1s ease;
            cursor: pointer;
        }
        .pixel-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--border-inner);
            filter: brightness(1.2);
        }
        .pixel-btn:active, .pixel-btn.active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--border-inner);
            background-color: var(--accent-main);
            color: #000;
        }

        :focus-visible {
            outline: 3px solid var(--accent-yellow);
            outline-offset: 2px;
        }

        .crt::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: var(--scanline-opacity);
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-outer); border: 2px solid var(--border-inner); }

        @keyframes pixelBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .sprite-animated { animation: pixelBounce 1.2s infinite steps(2); }

        @media (prefers-reduced-motion: reduce) {
            .sprite-animated, .animate-pulse { animation: none !important; }
            * { transition: none !important; }
        }

        /* Opciones seleccionables (radio / checkbox) */
        .opt {
            background: rgba(0,0,0,0.4);
            border: 2px solid var(--border-inner);
            cursor: pointer;
        }
        .opt:hover { border-color: var(--accent-main); }
        .opt:has(input:checked) { border-color: var(--accent-main); background: rgba(255,255,255,0.06); }

        /* Barra de slots */
        .slot { width: 10px; height: 14px; border: 2px solid var(--border-inner); background: rgba(0,0,0,0.4); }
        .slot.used { background: var(--accent-main); border-color: var(--accent-main); }

        /* Barra de progreso de comisión */
        .stage-seg { height: 12px; border: 2px solid var(--border-inner); background: rgba(0,0,0,0.4); }
        .stage-seg.done { background: var(--accent-cyan); border-color: var(--accent-cyan); }
        .stage-seg.current { background: var(--accent-main); border-color: var(--accent-main); }

        .hl { outline: 4px solid var(--accent-yellow); outline-offset: 4px; }

        .stepper-btn { width: 28px; height: 28px; line-height: 1; }
    </style>
</head>
<body class="crt min-h-screen flex flex-col font-retro selection:bg-red-500 selection:text-white">

    <!-- ================= HEADER ================= -->

                        <rect x="2" y="6" width="4" height="2"/><rect x="8" y="6" width="2" height="2"/><rect x="12" y="6" width="2" height="2"/>

                </div>
                <div>
                    <h1 class="font-pixel text-xs sm:text-sm text-[var(--accent-cyan)] tracking-wider">STEVEN ATAUCHI</h1>

            <!-- Navegación -->

                <button onclick="switchTab('gallery')" id="tab-btn-gallery" class="pixel-btn px-3 py-2 rounded-none" data-i18n="nav_gallery"></button>

            </nav>

            <!-- Idioma + Paleta -->
            <div class="flex items-center gap-3">

            <!-- Sobre mí / Por qué abrí comisiones -->

                        <!-- Extras del player -->
                        <div id="g-addons">
                            <div class="font-pixel text-[var(--accent-cyan)] mb-2" data-i18n="addons_label"></div>
                            <div class="space-y-2">
                                <!-- Animaciones custom -->
                                <div class="opt p-3 flex items-center gap-3 cursor-default">
                                    <div class="flex-1"><span data-i18n="anim_label"></span><div class="text-[9px] text-gray-400" data-i18n="anim_hint"></div></div>

                                        <span id="q-anims" class="font-pixel w-6 text-center">0</span>
                                        <button type="button" onclick="step('anims',1)" class="pixel-btn stepper-btn font-pixel" aria-label="+">+</button>
                                    </div>
                                </div>

        let lang = CONFIG.defaultLang;
        const t = (k) => (I18N[lang] && I18N[lang][k]) || I18N.es[k] || k;
        const tx = (o) => (o && (o[lang] || o.es)) || "";
        const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        function applyLang(l) {
            lang = I18N[l] ? l : "es";
            try { localStorage.setItem("lang", lang); } catch (e) {}
            document.documentElement.lang = lang;
            document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
            const active = document.getElementById("lang-" + lang);
            if (active) active.classList.add("active");
            renderSlots(); renderActive(); renderFinished(); renderGallery(); renderContacts(); calculateQuote();
        }

        /* ===================================================================
           TABS, TEMA, TOAST
           =================================================================== */
        function switchTab(tabId) {
            document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
            document.querySelectorAll("nav .pixel-btn").forEach(el => el.classList.remove("active"));
            const tab = document.getElementById("tab-" + tabId);
            const btn = document.getElementById("tab-btn-" + tabId);
            if (tab) tab.classList.remove("hidden");
            if (btn) btn.classList.add("active");
            window.scrollTo({ top: 0 });
        }

        function changeTheme(key) {
            document.body.classList.remove("theme-gb", "theme-cyber");
            if (key === "gb") document.body.classList.add("theme-gb");
            if (key === "cyber") document.body.classList.add("theme-cyber");
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            document.getElementById("toast-msg").textContent = msg;
            toast.classList.remove("hidden");
            setTimeout(() => toast.classList.add("hidden"), 2500);
        }

        /* ===================================================================
           SLOTS
           =================================================================== */
        function renderSlots() {
            const used = ACTIVE.length, total = CONFIG.totalSlots;
            let bar = "";
            for (let i = 0; i < total; i++) bar += `<span class="slot ${i < used ? "used" : ""}"></span>`;
            document.querySelectorAll(".slots-bar").forEach(el => el.innerHTML = bar);
            document.querySelectorAll(".slots-text").forEach(el => el.textContent = `${t("slots")} ${used}/${total} ${t("slots_taken")}`);
        }

        /* ===================================================================
           CALCULADORA
           =================================================================== */
        const S = { anims: 0, mods: 0, gfx: 1, gps: 1 };
        let lastQuote = null;

        function step(key, d) {
            const min = (key === "gfx" || key === "gps") ? 1 : 0;
            S[key] = Math.max(min, Math.min(20, S[key] + d));
            document.getElementById("q-" + key).textContent = S[key];
            calculateQuote();
        }

        const getVal = (name) => { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : null; };
        const fmtH = (a, b) => a === b ? `${a} h` : `${a}–${b} h`;

        function calculateQuote() {
            const cat = getVal("cat") || "player";

            // Mostrar / ocultar grupos según el tipo
            const groups = { player: ["g-ref", "g-addons"], abilities: ["g-addons"], gfx: ["g-gfx"], uber: ["g-uber"], gps: ["g-gps"], asar: ["g-asar"] };
            ["g-ref", "g-addons", "g-gfx", "g-uber", "g-gps", "g-asar"].forEach(id => {
                document.getElementById(id).classList.toggle("hidden", !groups[cat].includes(id));
            });

            // Proyectil solo si hay poder nuevo
            const newP = document.getElementById("opt-newpower");
            const proj = document.getElementById("opt-proj");
            proj.disabled = !newP.checked;
            if (!newP.checked) proj.checked = false;
            document.getElementById("lbl-proj").style.opacity = newP.checked ? "1" : "0.4";

            // Líneas de la factura: { key, qty, hMin, hMax, unit (null = sin definir) }
            const items = [];
            const add = (key, qty, hMin, hMax, unit) => items.push({ key, qty, hMin, hMax, unit });

            if (cat === "player") {
                const ref = getVal("ref");
                if (ref === "r1") add("li_ref1", 1, 7, 8, 75);
                if (ref === "r2") add("li_ref2", 1, 15, 15, 150);
                if (ref === "r3") add("li_ref3", 1, 20, 20, 200);
            }
            if (cat === "player" || cat === "abilities") {
                if (S.anims > 0) add("li_anim", S.anims, 4, 4, 40);
                const ab = getVal("ability");
                if (ab === "plain") add("li_ab_plain", 1, 4, 4, 40);
                if (ab === "anim") add("li_ab_anim", 1, 6, 6, 60);
                if (S.mods > 0) add("li_mod", S.mods, 5, 5, 50);
                if (newP.checked) add("li_newp", 1, 10, 10, 100);
                if (proj.checked) add("li_proj", 1, 5, 5, 50);
            }
            if (cat === "gfx") add("li_gfx", S.gfx, 2, 3, 25);
            if (cat === "uber") {
                const u = getVal("uber");
                if (u === "player") add("li_uber_player", 1, 5, 5, 50);
                if (u === "level") add("li_uber_level", 1, 5, 5, 50);
                if (u === "other") add("li_uber_other", 1, 0, 0, null);
            }
            if (cat === "gps") add("li_gps", S.gps, 0, 0, 30);
            if (cat === "asar") add("li_asar", 1, 0, 0, null);

            let total = 0, hMin = 0, hMax = 0, pending = false;
            let html = "";
            items.forEach(it => {
                const q = it.qty > 1 ? ` ×${it.qty}` : "";
                if (it.unit === null) {
                    pending = true;
                    html += `<div><div class="flex justify-between gap-2"><span>${esc(t(it.key))}${q}</span><span class="text-[var(--accent-yellow)]">${esc(t("tbd_short"))}</span></div>
                             <div class="text-[10px] text-[var(--accent-yellow)]">${esc(t("tbd"))}</div></div>`;
                } else {
                    const line = it.unit * it.qty;
                    total += line;
                    hMin += it.hMin * it.qty; hMax += it.hMax * it.qty;
                    const hTxt = it.hMax > 0 ? `<div class="text-[10px] text-gray-400">${fmtH(it.hMin * it.qty, it.hMax * it.qty)}</div>` : "";
                    html += `<div><div class="flex justify-between gap-2"><span>${esc(t(it.key))}${q}</span><span>$${line}</span></div>${hTxt}</div>`;
                }
            });
            if (!items.length) html = `<p class="text-gray-400">${esc(t("sum_empty"))}</p>`;

            const deposit = total / 2;
            document.getElementById("quote-breakdown").innerHTML = html;
            document.getElementById("quote-total").textContent = (total === 0 && pending) ? t("TBD") : `$${total} USD`;
            document.getElementById("quote-pending").classList.toggle("hidden", !(pending && total > 0));
            document.getElementById("quote-hours").textContent = hMax > 0 ? fmtH(hMin, hMax) : "—";
            document.getElementById("quote-deposit").textContent = `$${deposit.toFixed(2)}`;

            lastQuote = { cat, items, total, deposit, pending, hMin, hMax };
        }

        function copyCommissionRequest() {
            if (!lastQuote) return;
            const q = lastQuote;
            const vis = getVal("vis") === "anon" ? t("vis_anon") : t("vis_public");
            const discord = document.getElementById("in-discord").value.trim();
            const notes = document.getElementById("in-notes").value.trim();

            const lines = [`--- STEVEN ATAUCHI · ${t("inv_head")} ---`, `${t("inv_type")}: ${t("cat_" + q.cat)}`, `${t("inv_items")}:`];
            q.items.forEach(it => {
                const qty = it.qty > 1 ? ` x${it.qty}` : "";
                const price = it.unit === null ? t("tbd") : `$${it.unit * it.qty}`;
                lines.push(`  - ${t(it.key)}${qty}: ${price}`);
            });
            lines.push(`${t("inv_total")}: ${q.total === 0 && q.pending ? t("TBD") : "$" + q.total + " USD"}${q.pending && q.total > 0 ? " (" + t("pending_note") + ")" : ""}`);
            lines.push(`${t("inv_deposit")}: $${q.deposit.toFixed(2)}`);
            lines.push(`${t("inv_vis")}: ${vis}`);
            if (discord) lines.push(`${t("inv_discord")}: ${discord}`);
            if (notes) lines.push(`${t("inv_notes")}: ${notes}`);
            lines.push("------------------------------------------");
            const text = lines.join("\n");

            const fallback = () => {
                const ta = document.createElement("textarea");
                ta.value = text; document.body.appendChild(ta); ta.select();
                try { document.execCommand("copy"); } catch (e) {}
                document.body.removeChild(ta);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(fallback);
            } else { fallback(); }
            showToast(t("toast_copied"));
        }

        /* ===================================================================
           COMISIONES EN CURSO / FINALIZADAS
           =================================================================== */
        function fmtDate(iso) {
            return new Date(iso + "T00:00:00").toLocaleDateString(LOCALES[lang], { year: "numeric", month: "short", day: "numeric" });
        }
        function daysSince(iso) {
            return Math.max(0, Math.floor((Date.now() - new Date(iso + "T00:00:00").getTime()) / 86400000));
        }

        function renderActive() {
            const el = document.getElementById("active-list");
            if (!el) return;
            const list = [...ACTIVE].sort((a, b) => a.start.localeCompare(b.start));
            if (!list.length) { el.innerHTML = `<p class="text-xs text-gray-400 p-4">${esc(t("empty_active"))}</p>`; return; }

            el.innerHTML = list.map(c => {

                        <div class="stage-seg ${i < c.stage ? "done" : i === c.stage ? "current" : ""}"></div>
                        <div class="text-[9px] font-pixel mt-1 ${i === c.stage ? "text-[var(--accent-main)]" : "text-gray-400"}">${i === c.stage ? "▶ " : ""}${esc(t("st" + i))}</div>

                const head = c.anonymous

                           <div><h3 class="font-pixel text-xs text-[var(--accent-yellow)]">${esc(t("anon_title"))}</h3>
                           <p class="text-[11px] text-gray-400 mt-1">${esc(t("anon_text"))}</p></div>
                       </div>`
                    : `<div><h3 class="font-pixel text-xs text-[var(--accent-cyan)]">${esc(c.name)}</h3>
                       <span class="inline-block mt-2 text-[9px] font-pixel px-1.5 py-0.5 bg-[var(--border-outer)] text-[var(--accent-yellow)] border border-[var(--border-inner)]">${esc(t("cat_" + c.type))}</span></div>`;

                return `<div class="pixel-box p-4 space-y-4">
                    <div class="flex flex-wrap justify-between gap-3">
                        ${head}
                        <div class="text-right text-[10px] font-pixel text-gray-300">
                            <div class="text-gray-400">${esc(t("started"))}</div>
                            <div>${esc(fmtDate(c.start))}</div>
                            <div class="text-[var(--accent-yellow)] mt-1">${esc(t("days_ago").replace("{n}", daysSince(c.start)))}</div>
                        </div>
                    </div>
                    <div class="flex gap-1" role="img" aria-label="${esc(t("st" + c.stage))}">${segs}</div>
                </div>`;
            }).join("");
        }

        function renderFinished() {
            const el = document.getElementById("finished-list");
            if (!el) return;
            const list = [...FINISHED].sort((a, b) => b.end.localeCompare(a.end));
            if (!list.length) { el.innerHTML = `<p class="text-xs text-gray-400 p-4">${esc(t("empty_fin"))}</p>`; return; }
            el.innerHTML = list.map(f => `
                <div class="pixel-box p-4 flex flex-col justify-between gap-3 border-[var(--accent-green)]">
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <h3 class="font-pixel text-xs text-[var(--accent-green)]">✔ ${esc(f.name)}</h3>
                            <span class="text-[9px] font-pixel px-1.5 py-0.5 bg-[var(--border-outer)] text-[var(--accent-yellow)] border border-[var(--border-inner)]">${esc(t("cat_" + f.type))}</span>

                        <p class="text-[10px] text-gray-400 font-pixel mt-1">${esc(t("finished_on"))}: ${esc(fmtDate(f.end))}</p>
                    </div>
                    <button onclick="goToGallery('${esc(f.galleryId)}')" class="pixel-btn px-3 py-2 text-[10px] font-pixel bg-[var(--accent-green)] text-black font-bold">${esc(t("btn_gallery"))}</button>
                </div>`).join("");
        }

        /* ===================================================================
           GALERÍA
           =================================================================== */
        let galFilter = "all";
        const GAL_KEYS = { player: "f_player", gfx: "f_gfx", resource: "f_res" };

        function renderGallery() {
            const el = document.getElementById("gallery-container");
            if (!el) return;
            const list = GALLERY.filter(g => galFilter === "all" || g.category === galFilter);
            if (!list.length) { el.innerHTML = `<p class="text-xs text-gray-400 p-4">${esc(t("empty_gal"))}</p>`; return; }
            el.innerHTML = list.map(g => {
                const media = g.image
                    ? `<img src="${esc(g.image)}" alt="${esc(g.title)}" loading="lazy" class="w-full h-full object-cover pixel-img">`
                    : `<div class="flex flex-col items-center gap-2 text-gray-400">
                           <svg viewBox="0 0 16 16" class="w-14 h-14 fill-current text-[var(--border-inner)]" aria-hidden="true"><rect x="2" y="2" width="12" height="12" opacity=".35"/><rect x="6" y="4" width="4" height="2"/><rect x="9" y="6" width="2" height="2"/><rect x="7" y="8" width="2" height="2"/><rect x="7" y="11" width="2" height="2"/></svg>
                           <span class="text-[9px] font-pixel">${esc(t("no_image"))}</span></div>`;
                const link = g.link ? `<a href="${esc(g.link)}" target="_blank" rel="noopener" class="pixel-btn px-3 py-1 text-[10px] font-pixel inline-block">${esc(t("view_more"))}</a>` : "";
                // El botón "Descargar" solo aparece si el trabajo tiene un enlace en "download"
                const dl = g.download ? `<a href="${esc(g.download)}" target="_blank" rel="noopener" class="pixel-btn px-3 py-1 text-[10px] font-pixel inline-block bg-[var(--accent-green)] text-black font-bold">${esc(t("download"))}</a>` : "";
                return `<div id="gal-${esc(g.id)}" class="pixel-box p-4 flex flex-col gap-3">
                    <div class="aspect-video bg-black/40 border-2 border-[var(--border-inner)] flex items-center justify-center overflow-hidden">${media}</div>
                    <div class="flex justify-between items-start gap-2">
                        <h3 class="font-pixel text-xs text-[var(--accent-cyan)]">${esc(g.title)}</h3>
                        <span class="text-[9px] font-pixel px-1.5 py-0.5 bg-[var(--border-outer)] text-[var(--accent-yellow)] border border-[var(--border-inner)]">${esc(t(GAL_KEYS[g.category] || "f_all"))}</span>
                    </div>
                    <p class="text-xs text-gray-300">${esc(tx(g.desc))}</p>
                    <div class="flex justify-between items-center pt-2 border-t border-[var(--border-outer)]">
                        <span class="text-[10px] font-pixel text-gray-400">${esc(fmtDate(g.date))}</span><div class="flex flex-wrap gap-2 justify-end">${dl}${link}</div>
                    </div>
                </div>`;
            }).join("");
        }

        function filterGallery(cat, btn) {
            galFilter = cat;
            document.querySelectorAll(".gal-filter-btn").forEach(b => b.classList.remove("active"));
            if (btn) btn.classList.add("active");
            renderGallery();
        }

        function goToGallery(id) {
            galFilter = "all";
            document.querySelectorAll(".gal-filter-btn").forEach((b, i) => b.classList.toggle("active", i === 0));
            renderGallery();
            switchTab("gallery");
            const target = document.getElementById("gal-" + id);
            if (target) {
                target.scrollIntoView({ block: "center" });
                target.classList.add("hl");
                setTimeout(() => target.classList.remove("hl"), 2500);
            }
        }

        /* ===================================================================
           CONTACTO
           =================================================================== */
        function renderContacts() {
            const el = document.getElementById("contact-list");
            if (!el) return;
            el.innerHTML = CONTACTS.map(c => {
                const inner = `<div class="text-[var(--accent-yellow)] font-pixel text-[10px] mb-1">${esc(c.label)}</div>
                               <div class="text-[var(--accent-cyan)] break-all">${esc(c.value)}</div>`;
                return c.href
                    ? `<a href="${esc(c.href)}" target="_blank" rel="noopener" class="block p-3 bg-black/30 border border-[var(--border-inner)] hover:border-[var(--accent-main)]">${inner}</a>`
                    : `<div class="p-3 bg-black/30 border border-[var(--border-inner)]">${inner}</div>`;
            }).join("");
        }

        /* ===================================================================
           INICIO
           =================================================================== */
        window.onload = function () {
            document.querySelectorAll("[data-avatar]").forEach(img => { img.src = CONFIG.avatar; });
            let saved = null;
            try { saved = localStorage.getItem("lang"); } catch (e) {}
            applyLang(saved && I18N[saved] ? saved : CONFIG.defaultLang);
        };
    </script>
</body>
</html>
